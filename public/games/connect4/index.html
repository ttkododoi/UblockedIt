<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Four in a Row</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font:15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif;
    background:#fff; color:#1d1d1f; display:grid; place-items:center; padding:18px;
    user-select:none; -webkit-user-select:none;
  }
  .app { width:min(560px,100%); }
  header { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .seg { display:inline-flex; background:#f5f5f7; border-radius:9px; padding:3px; }
  .seg button { border:0; background:transparent; font:inherit; font-size:12.5px; font-weight:500; padding:5px 12px; border-radius:7px; color:#6e6e73; cursor:pointer; transition:all .18s; }
  .seg button.on { background:#fff; color:#1d1d1f; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .turn { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:13px; font-weight:550; }
  .dot { width:14px; height:14px; border-radius:50%; }
  .dot.r { background:#ff3b30; } .dot.y { background:#ffcc00; }
  #board {
    display:grid; grid-template-columns:repeat(7,1fr); gap:8px; background:#cfe3fb; padding:10px;
    border-radius:18px; box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 8px 30px rgba(0,60,140,.10);
  }
  .col { display:flex; flex-direction:column; gap:8px; cursor:pointer; border-radius:12px; padding:2px; transition:background .16s; }
  .col:hover { background:rgba(255,255,255,.35); }
  .hole { aspect-ratio:1; border-radius:50%; background:#fff; box-shadow:inset 0 2px 4px rgba(0,0,0,.10); position:relative; overflow:hidden; }
  .disc { position:absolute; inset:0; border-radius:50%; transform:translateY(-115%); transition:transform .32s cubic-bezier(.34,1.4,.64,1); }
  .disc.in { transform:translateY(0); }
  .disc.r { background:radial-gradient(circle at 32% 28%, #ff8a80, #ff3b30 60%); }
  .disc.y { background:radial-gradient(circle at 32% 28%, #ffe680, #ffcc00 60%); }
  .win { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { filter:brightness(1.18); } }
  .banner { position:fixed; inset:0; display:grid; place-items:center; background:rgba(255,255,255,.87); backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:opacity .3s; }
  .banner.show { opacity:1; pointer-events:auto; }
  .banner .box { text-align:center; padding:30px; }
  .banner h2 { font-size:26px; letter-spacing:-.03em; margin-bottom:6px; }
  .banner p { color:#6e6e73; font-size:13.5px; margin-bottom:18px; }
  .btn { border:0; border-radius:11px; padding:11px 22px; font:inherit; font-weight:550; font-size:13.5px; background:#0071e3; color:#fff; cursor:pointer; transition:transform .18s; }
  .btn:hover { transform:translateY(-1px); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="seg" id="mode">
      <button data-ai="1" class="on">vs Computer</button>
      <button data-ai="0">2 Players</button>
    </div>
    <div class="turn"><span class="dot r"></span><span id="turnText">Your turn</span></div>
  </header>
  <div id="board"></div>
</div>
<div class="banner" id="banner"><div class="box"><h2 id="bTitle">Red wins</h2><p id="bText">Four in a row.</p><button class="btn" id="again">Play again</button></div></div>
<script>
(() => {
  const ROWS = 6, COLS = 7;
  const boardEl = document.getElementById('board');
  const turnText = document.getElementById('turnText');
  const banner = document.getElementById('banner');
  let grid, turn, over, vsAI = true, busy = false;

  const cellsEl = [];

  function build() {
    boardEl.innerHTML = '';
    cellsEl.length = 0;
    grid = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
    turn = 1; over = false; busy = false;
    banner.classList.remove('show');
    for (let c = 0; c < COLS; c++) {
      const col = document.createElement('div');
      col.className = 'col';
      col.dataset.c = c;
      col.addEventListener('click', () => play(c));
      for (let r = 0; r < ROWS; r++) {
        const hole = document.createElement('div');
        hole.className = 'hole';
        col.appendChild(hole);
      }
      boardEl.appendChild(col);
      cellsEl.push([...col.children]);
    }
    syncTurn();
  }

  function syncTurn() {
    turnText.textContent = over ? 'Game over' : turn === 1 ? (vsAI ? 'Your turn' : 'Red’s turn') : (vsAI ? 'Computer thinking' : 'Yellow’s turn');
    document.querySelector('.turn .dot').className = 'dot ' + (turn === 1 ? 'r' : 'y');
  }

  function drop(c, player) {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (!grid[r][c]) {
        grid[r][c] = player;
        const disc = document.createElement('div');
        disc.className = 'disc ' + (player === 1 ? 'r' : 'y');
        cellsEl[c][r].appendChild(disc);
        requestAnimationFrame(() => disc.classList.add('in'));
        return { r, c };
      }
    }
    return null;
  }

  function play(c) {
    if (over || busy) return;
    if (vsAI && turn === 2) return;
    const dropRes = drop(c, turn);
    if (!dropRes) return;
    const win = checkWin(dropRes.r, dropRes.c, turn);
    if (win) return finish(turn, win);
    if (isFull()) return finish(0, []);
    turn = 3 - turn;
    syncTurn();
    if (vsAI && turn === 2) {
      busy = true;
      setTimeout(() => {
        const best = bestMove();
        const res = drop(best, 2);
        busy = false;
        if (!res) return;
        const w = checkWin(res.r, res.c, 2);
        if (w) return finish(2, w);
        if (isFull()) return finish(0, []);
        turn = 1;
        syncTurn();
      }, 300);
    }
  }

  function checkWin(r, c, p) {
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (const [dr, dc] of dirs) {
      const line = [[r,c]];
      for (const sign of [1,-1]) {
        let rr = r + dr*sign, cc = c + dc*sign;
        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && grid[rr][cc] === p) {
          line.push([rr,cc]); rr += dr*sign; cc += dc*sign;
        }
      }
      if (line.length >= 4) return line;
    }
    return null;
  }

  const isFull = () => grid[0].every((v) => v !== 0);

  function finish(winner, line) {
    over = true;
    syncTurn();
    if (line) line.forEach(([r, c]) => {
      const disc = cellsEl[c][r].firstElementChild;
      if (disc) disc.classList.add('win');
    });
    banner.classList.add('show');
    document.getElementById('bTitle').textContent = winner === 0 ? 'Draw' : winner === 1 ? 'You win' : (vsAI ? 'Computer wins' : 'Yellow wins');
    document.getElementById('bText').textContent = winner === 0 ? 'The grid is full.' : 'Four in a row.';
    window.parent?.postMessage({ type: 'ubid:score', game: 'connect4', score: winner === 1 ? 500 : winner === 0 ? 100 : 0 }, '*');
  }

  const valid = (c) => grid[0][c] === 0;

  function scoreWindow(win, p) {
    const opp = 3 - p;
    const mine = win.filter((v) => v === p).length;
    const theirs = win.filter((v) => v === opp).length;
    if (mine && theirs) return 0;
    if (mine === 4) return 100000;
    if (mine === 3) return 120;
    if (mine === 2) return 12;
    if (theirs === 3) return -140;
    if (theirs === 2) return -10;
    return 0;
  }

  function evaluate(p) {
    let total = 0;
    const opp = 3 - p;
    // centre preference
    for (let r = 0; r < ROWS; r++) if (grid[r][3] === p) total += 6;
    const lines = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (c + 3 < COLS) lines.push([[r,c],[r,c+1],[r,c+2],[r,c+3]]);
      if (r + 3 < ROWS) lines.push([[r,c],[r+1,c],[r+2,c],[r+3,c]]);
      if (r + 3 < ROWS && c + 3 < COLS) lines.push([[r,c],[r+1,c+1],[r+2,c+2],[r+3,c+3]]);
      if (r + 3 < ROWS && c - 3 >= 0) lines.push([[r,c],[r+1,c-1],[r+2,c-2],[r+3,c-3]]);
    }
    for (const line of lines) {
      const vals = line.map(([r, c]) => grid[r][c]);
      total += scoreWindow(vals, p);
    }
    return total;
  }

  function bestMove() {
    let best = null, bestScore = -Infinity;
    const order = [3, 2, 4, 1, 5, 0, 6].filter(valid);
    for (const c of order) {
      const r = dropSim(c, 2);
      if (r == null) continue;
      let s = evaluate(2);
      // block opponent wins
      for (const cc of [3,2,4,1,5,0,6].filter(valid)) {
        const rr = dropSim(cc, 1);
        if (rr != null) {
          const line = checkWin(rr, cc, 1);
          if (line) s -= 5000;
          grid[rr][cc] = 0;
        }
      }
      grid[r][c] = 0;
      s += Math.random() * 4;
      if (s > bestScore) { bestScore = s; best = c; }
    }
    return best ?? order[0] ?? 0;
  }

  function dropSim(c, p) {
    for (let r = ROWS - 1; r >= 0; r--) if (!grid[r][c]) { grid[r][c] = p; return r; }
    return null;
  }

  document.getElementById('mode').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    [...e.currentTarget.children].forEach((x) => x.classList.toggle('on', x === b));
    vsAI = b.dataset.ai === '1';
    build();
  });
  document.getElementById('again').addEventListener('click', build);
  build();
})();
</script>
</body>
</html>
