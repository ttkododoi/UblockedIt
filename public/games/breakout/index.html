<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Vector Breakout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #04040a; font-family: ui-monospace, Menlo, monospace; }
  body { display: grid; place-items: center; }
  canvas { display: block; touch-action: none; border-radius: 14px; box-shadow: 0 0 100px rgba(255,46,99,.16), 0 30px 80px rgba(0,0,0,.7); }
  .hud { position: absolute; top: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 26px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.45); pointer-events: none; }
  .hud span b { color: #08d9d6; font-size: 15px; margin-left: 6px; letter-spacing: 0; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 50% 45%, rgba(255,46,99,.2), rgba(4,4,10,.94) 70%); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .3s; border-radius: 14px; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .panel { padding: 30px 36px; border-radius: 20px; border: 1px solid rgba(255,255,255,.12); background: rgba(10,10,20,.7); }
  h1 { font-size: clamp(24px,4.6vw,38px); letter-spacing: -.04em; background: linear-gradient(120deg,#ff2e63,#08d9d6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: rgba(255,255,255,.55); font-size: 13px; line-height: 1.7; max-width: 330px; margin-top: 8px; }
  button { margin-top: 18px; padding: 11px 24px; border: 0; border-radius: 12px; cursor: pointer; font-family: inherit; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; color: #12020a; background: linear-gradient(135deg,#ff2e63,#08d9d6); box-shadow: 0 10px 30px rgba(255,46,99,.3); }
  button:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <span>Score<b id="score">0</b></span>
  <span>Lives<b id="lives">3</b></span>
  <span>Level<b id="level">1</b></span>
</div>
<div class="overlay show" id="overlay">
  <div class="panel">
    <h1 id="title">Vector Breakout</h1>
    <p id="msg">Move with the mouse, arrows or touch. Clear every brick. The ball gets faster — and angrier.</p>
    <button id="start">Launch ball</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const startBtn = document.getElementById('start');

  const W = 640, H = 800;
  let dpr = Math.min(devicePixelRatio || 1, 2);
  let scale = 1;

  function resize() {
    scale = Math.min((window.innerWidth - 24) / W, (window.innerHeight - 24) / H);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const COLORS = ['#ff2e63', '#ff7b00', '#ffd166', '#08d9d6', '#7b2ff7', '#00f5d4'];
  let paddle, balls, bricks, particles, score, lives, level, running, awaiting, combo;
  const keys = {};

  function makeBricks(lv) {
    const cols = 9, rows = Math.min(3 + lv, 7);
    const bw = 60, bh = 24, gap = 8;
    const totalW = cols * bw + (cols - 1) * gap;
    const startX = (W - totalW) / 2;
    const out = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() < 0.06 + lv * 0.012) continue;
        out.push({
          x: startX + c * (bw + gap),
          y: 110 + r * (bh + gap),
          w: bw, h: bh,
          color: COLORS[(r + lv) % COLORS.length],
          hp: 1 + (r < Math.floor(rows / 3) ? 1 : 0),
          alive: true,
        });
      }
    }
    return out;
  }

  function resetBall(hard = false) {
    balls = [{ x: W / 2, y: H - 130, vx: 0, vy: 0, r: 8, trail: [] }];
    awaiting = true;
    running = true;
    if (hard) paddle.x = W / 2 - paddle.w / 2;
  }

  function newGame() {
    paddle = { x: W / 2 - 60, y: H - 74, w: 120, h: 14, vx: 0 };
    score = 0; lives = 3; level = 1;
    bricks = makeBricks(level);
    particles = [];
    combo = 0;
    resetBall(true);
    overlay.classList.remove('show');
    syncHud();
  }

  function syncHud() {
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    levelEl.textContent = level;
    window.parent?.postMessage({ type: 'ubid:score', game: 'vector-breakout', score }, '*');
  }

  function burst(x, y, color) {
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 4;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color });
    }
  }

  function launch() {
    if (!awaiting) return;
    awaiting = false;
    const b = balls[0];
    const angle = (-Math.PI / 2) + (Math.random() - 0.5) * 0.7;
    const speed = 7 + level * 0.35;
    b.vx = Math.cos(angle) * speed;
    b.vy = Math.sin(angle) * speed;
  }

  function gameOver(win) {
    running = false;
    const finalScore = score;
    titleEl.textContent = win ? 'Level cleared' : 'Board wiped';
    msgEl.textContent = win
      ? `Level ${level} down. Ready for ${level + 1}?`
      : `Final score ${finalScore}. The bricks send their regards.`;
    startBtn.textContent = win ? 'Next level' : 'Try again';
    overlay.classList.add('show');
    window.parent?.postMessage({ type: 'ubid:score', game: 'vector-breakout', score: finalScore }, '*');
    if (win) level++;
  }

  startBtn.addEventListener('click', () => {
    if (titleEl.textContent === 'Level cleared') {
      bricks = makeBricks(level);
      balls = [];
      paddle.x = W / 2 - paddle.w / 2;
      resetBall();
      overlay.classList.remove('show');
      syncHud();
    } else {
      newGame();
    }
  });

  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp'].includes(e.key)) e.preventDefault();
    if (e.key === ' ') launch();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function pointerX(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    return (cx / rect.width) * W;
  }
  canvas.addEventListener('mousemove', (e) => {
    if (!paddle) return;
    paddle.x = Math.max(0, Math.min(W - paddle.w, pointerX(e) - paddle.w / 2));
  });
  canvas.addEventListener('touchmove', (e) => {
    if (!paddle) return;
    paddle.x = Math.max(0, Math.min(W - paddle.w, pointerX(e) - paddle.w / 2));
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('pointerdown', launch);

  function step() {
    if (!running) return;
    // paddle keyboard
    const accel = 12;
    if (keys['ArrowLeft'] || keys['a']) paddle.x -= accel;
    if (keys['ArrowRight'] || keys['d']) paddle.x += accel;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    for (const b of balls) {
      if (awaiting) { b.x = paddle.x + paddle.w / 2; b.y = paddle.y - 14; continue; }
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 9) b.trail.shift();
      b.x += b.vx; b.y += b.vy;

      if (b.x - b.r < 0) { b.x = b.r; b.vx *= -1; burst(0, b.y, '#08d9d6'); }
      if (b.x + b.r > W) { b.x = W - b.r; b.vx *= -1; burst(W, b.y, '#08d9d6'); }
      if (b.y - b.r < 0) { b.y = b.r; b.vy *= -1; burst(b.x, 0, '#08d9d6'); }

      // paddle
      if (b.vy > 0 && b.y + b.r > paddle.y && b.y - b.r < paddle.y + paddle.h &&
          b.x > paddle.x - b.r && b.x < paddle.x + paddle.w + b.r) {
        const hit = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const speed = Math.hypot(b.vx, b.vy) * 1.012;
        const angle = hit * 1.05;
        b.vx = Math.sin(angle) * speed;
        b.vy = -Math.cos(angle) * speed;
        b.y = paddle.y - b.r - 1;
        burst(b.x, b.y, '#ff2e63');
        combo = 0;
      }

      // bricks
      for (const br of bricks) {
        if (!br.alive) continue;
        if (b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
          br.hp--;
          const overlapX = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
          const overlapY = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
          if (overlapX < overlapY) b.vx *= -1; else b.vy *= -1;
          if (br.hp <= 0) {
            br.alive = false;
            combo++;
            score += 50 * Math.min(combo, 5);
            burst(br.x + br.w / 2, br.y + br.h / 2, br.color);
            syncHud();
          } else {
            burst(b.x, b.y, br.color);
          }
          break;
        }
      }

      if (b.y - b.r > H) {
        balls = balls.filter(x => x !== b);
      }
    }

    if (balls.length === 0) {
      lives--;
      syncHud();
      if (lives <= 0) gameOver(false);
      else resetBall();
    }

    if (bricks.every(b => !b.alive)) gameOver(true);

    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.99; p.life -= 0.022;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function draw() {
    const g = ctx.createRadialGradient(W / 2, H * .35, 40, W / 2, H * .5, H);
    g.addColorStop(0, '#101024');
    g.addColorStop(1, '#04040a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }

    for (const br of bricks) {
      if (!br.alive) continue;
      ctx.shadowColor = br.color; ctx.shadowBlur = 16;
      ctx.fillStyle = br.color;
      const r = 6;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(br.x, br.y, br.w, br.h, r); else ctx.rect(br.x, br.y, br.w, br.h);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.fillRect(br.x + 4, br.y + 3, br.w - 8, 3);
      if (br.hp > 1) {
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.beginPath(); ctx.arc(br.x + br.w - 9, br.y + 9, 2.5, 0, 7); ctx.fill();
      }
    }

    ctx.shadowColor = '#ff2e63'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#ff2e63';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7); else ctx.rect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.fill();

    for (const b of balls) {
      for (let i = 0; i < b.trail.length; i++) {
        const t = b.trail[i];
        ctx.globalAlpha = (i / b.trail.length) * 0.35;
        ctx.fillStyle = '#08d9d6';
        ctx.beginPath(); ctx.arc(t.x, t.y, b.r * (i / b.trail.length), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowColor = '#08d9d6'; ctx.shadowBlur = 26;
      ctx.fillStyle = '#e8ffff';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.6 * p.life + 0.6, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (awaiting && running) {
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      ctx.font = '600 12px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('CLICK / SPACE TO LAUNCH', W / 2, paddle.y - 36);
    }
  }

  let last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (!last) last = t;
    const dt = Math.min(50, t - last);
    last = t;
    const iterations = Math.max(1, Math.round(dt / 16.67));
    for (let i = 0; i < iterations; i++) step();
    draw();
  }

  // idle demo state
  paddle = { x: W / 2 - 60, y: H - 74, w: 120, h: 14 };
  balls = [];
  bricks = makeBricks(1);
  particles = [];
  score = 0; lives = 3; level = 1; awaiting = false; running = false; combo = 0;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
