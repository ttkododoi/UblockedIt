<!doctype html>
<html lang="en" data-theme="white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="UblockedIt — self-hosted browser games, thirty emulator cores, a real APK runner and a community hub. No embeds, no ads." />
    <meta name="color-scheme" content="light dark" />
    <title>UblockedIt — Every game, hosted right here</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Critical shell paint: white first frame, no flash of unstyled content. */
      html { background: #ffffff; }
      html[data-theme='graphite'], html[data-theme='midnight'] { background: #000; }
      body { margin: 0; }
      #boot { min-height: 100vh; display: grid; place-items: center; background: inherit; }
      #boot span {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid #d2d2d7; border-top-color: #0071e3;
        animation: bootspin 0.8s linear infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><span></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
